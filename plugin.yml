name: Vault Docker Login Buildkite Plugin
description: Logs into docker with credentials stored in vault
author: https://github.com/alpar-t
requirements:
  - bash
  - vault
configuration:
  properties:
    secret_path:
      type: string
    disable_logout:
      type: boolean
    retries:
      type: integer
    retry_delay:
      type: integer
  additionalProperties: false
