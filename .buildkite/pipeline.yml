steps:
  - label: ":bash: Tests"
    command: "make tests"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: ":shell: Shellcheck"
    command: "make shellcheck"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: "Pre-commit"
    command: "make pre-commit"
    agents:
      image: "docker.elastic.co/ci-agent-images/ubuntu-build-essential"

  - label: ":sparkles: Lint"
    command: "make lint"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: Validate TokenPolicy RREs
    command: "/agent/check-catalog-info.sh"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.35.0@sha256:4e521947861821d7607b26b95c141f47e6a8794c6b15e53b1813dafea61a557b"
    if_changed:
      - "catalog-info.yaml"
