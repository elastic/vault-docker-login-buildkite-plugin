steps:
  - label: ":bash: Tests"
    command: "make tests"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: ":shell: Shellcheck"
    command: "make shellcheck"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: "Pre-commit"
    command: "make pre-commit"
    agents:
      image: "docker.elastic.co/ci-agent-images/ubuntu-build-essential"

  - label: ":sparkles: Lint"
    command: "make lint"
    agents:
      provider: "gcp"
      image: family/core-ubuntu-2204

  - label: Validate catalog-info
    command: "/agent/check-catalog-info.sh"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.36.0@sha256:2e7794253beec90373c69a1ea6018a2f4b6ea3f96af4ff695ed6334d6e627ac4"
    if_changed:
      - "catalog-info.yaml"
