version: '3.7'
services:
  tests:
    image: buildkite/plugin-tester:v5.0.0@sha256:c74eac4f480f9cf3835bff56ba0cbd20d7c988f64444b192dd3346c924397fd3
    platform: linux/amd64
    volumes:
      - .:/plugin

  lint:
    image: buildkite/plugin-linter
    command: ['--id', 'elastic/vault-docker-login']
    volumes:
      - ".:/plugin"

  shellcheck:
    image: koalaman/shellcheck:latest
    command: -x hooks/pre-command hooks/pre-exit
    working_dir: /plugin
    volumes:
      - ".:/plugin"
