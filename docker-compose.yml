version: '3.7'
services:
  tests:
    image: buildkite/plugin-tester:v4.4.0@sha256:0eef2eeb04d4e9a2051f671df998cc7442ce017379dcf4debf5d2beed34506fb
    platform: linux/amd64
    volumes:
      - .:/plugin

  lint:
    image: buildkite/plugin-linter
    command: ['--id', 'elastic/vault-docker-login']
    volumes:
      - ".:/plugin"

  shellcheck:
    image: koalaman/shellcheck:latest
    command: -x hooks/pre-command hooks/pre-exit
    working_dir: /plugin
    volumes:
      - ".:/plugin"
